name: Stock Alerts

on:
  schedule:
    # 21:30 UTC weekdays = 04:30 Bangkok next day (after US market close)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit prices.db + state back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alerts
        env:
          DISCORD_ALERTS_URL:     ${{ secrets.DISCORD_ALERTS_URL }}
          DISCORD_CANDIDATES_URL: ${{ secrets.DISCORD_CANDIDATES_URL }}
          DISCORD_ERRORS_URL:     ${{ secrets.DISCORD_ERRORS_URL }}
        run: python main.py

      - name: Commit updated cache + state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.db alert_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update cache + state [skip ci]"
          git push || true
