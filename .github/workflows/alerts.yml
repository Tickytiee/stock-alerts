name: Stock Alerts

on:
  schedule:
    # 21:30 UTC weekdays = 04:30 Bangkok next day (after US market close)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Restore bot state
        uses: actions/cache@v5
        with:
          path: |
            prices.db
            alert_state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python test_signals.py

      - name: Run alerts
        env:
          DISCORD_ALERTS_URL:     ${{ secrets.DISCORD_ALERTS_URL }}
          DISCORD_CANDIDATES_URL: ${{ secrets.DISCORD_CANDIDATES_URL }}
          DISCORD_ERRORS_URL:     ${{ secrets.DISCORD_ERRORS_URL }}
        run: python main.py